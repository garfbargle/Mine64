<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Mine64 — an infinite block-building world for Nintendo 64." />
    <meta name="theme-color" content="#101b23" />
    <link rel="icon" href="favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Press+Start+2P&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <title>Mine64 — built for Nintendo 64</title>
  </head>
  <body>
    <main class="landing" id="top">
      <div class="world-backdrop" aria-hidden="true"></div>
      <div class="atmosphere" aria-hidden="true"></div>

      <header>
        <a class="wordmark" href="#top" aria-label="Mine64 home">MINE<span>64</span></a>
        <div class="header-meta">
          <a class="expansion-badge" href="/extras/ram-map" aria-label="View Mine64 RAM map">
            <span class="expansion-icon"><img src="images/expansion-pak.png" alt="" /></span>
            <b>NO EXPANSION PAK<br />REQUIRED</b>
          </a>
        </div>
      </header>

      <section class="intro" aria-labelledby="title">
        <div class="intro-copy">
          <h1 class="product-stage" id="title">
            <img class="cartridge-art" src="images/mine64-cartridge.png" alt="Mine64 Nintendo 64 cartridge" />
            <img class="box-art" src="images/mine64-box.png" alt="Mine64 Nintendo 64 box art" />
          </h1>
          <div class="hero-actions">
            <button class="play-button" id="launch-game" type="button"><span>▶</span> PLAY NOW</button>
            <a class="github-button" href="https://github.com/garfbargle/Mine64" target="_blank" rel="noreferrer">VIEW ON GITHUB ↗</a>
          </div>
          <p class="play-note">INFINITE WORLD / 4 PLAYERS / SAVES / MODS</p>
        </div>
        <div class="showcase-panel">
          <video id="showcase-video" autoplay muted loop controls playsinline preload="metadata" poster="images/forest.png" aria-label="Mine64 gameplay showcase">
            <source src="media/mine64-showcase-v3.mp4?v=20260814" type="video/mp4" />
            Your browser does not support embedded video.
          </video>
        </div>
      </section>

      <section class="screens" aria-label="Mine64 screenshots">
        <div class="screen-strip">
          <button class="shot" type="button" data-image="images/world.png" aria-label="Show overworld screenshot"><img src="images/world.png" alt="Mine64 world exploration" /></button>
          <button class="shot active" type="button" data-image="images/forest.png" aria-label="Show forest screenshot"><img src="images/forest.png" alt="Mine64 forest" /></button>
          <button class="shot" type="button" data-image="images/animals.png" aria-label="Show animals screenshot"><img src="images/animals.png" alt="Mine64 animals" /></button>
          <button class="shot" type="button" data-image="images/pack.png" aria-label="Show inventory screenshot"><img src="images/pack.png" alt="Mine64 inventory" /></button>
        </div>
      </section>

    </main>

    <section class="player-overlay" id="player-overlay" aria-hidden="true" aria-label="Mine64 browser player">
      <div class="player-bar"><span>MINE64 / PLAYER 01</span><span id="emulator-status">LOADING WORLD</span><button id="close-game" type="button">ESC / CLOSE ×</button></div>
      <div id="game"></div>
      <p>STICK — MOVE &nbsp; A — PLACE / USE &nbsp; B — MINE / PUNCH &nbsp; START — PACK</p>
    </section>

    <script src="app.js"></script>
  </body>
</html>
